[tool.ruff.lint]
select = ["E9", "F", "B", "S", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.coverage.run]
source = ["deploy/docling", "deploy/markitdown"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.coverage.html]
directory = "reports/python-coverage/html"

[tool.coverage.json]
output = "reports/python-coverage/coverage.json"

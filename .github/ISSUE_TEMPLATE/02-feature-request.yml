name: 功能需求 / Feature
description: 提出新的能力或用户体验改进，并说明验收条件。
title: '[Feature] '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue，用合成场景说明需求。此仓库公开，请勿提交真实业务文档、凭证、客户信息或内部地址。模板用于明确需求，不要求提交者先完成技术设计。
  - type: textarea
    id: problem
    attributes:
      label: 用户场景与问题
      description: 谁在什么操作中遇到了什么困难？当前做法有什么限制？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望能力与范围
      description: 描述需要实现的行为与受影响组件；如有明确的范围外事项也请说明。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收条件
      description: 使用可以观察或验证的结果，避免只写“完善”“优化”等笼统目标。
      placeholder: |
        - [ ] 在合成场景……下，用户可以……
        - [ ] 当输入不合法时，系统提示……
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与关联资料（可选）
      description: 可填写临时做法、其他方案、已脱敏示例及相关 Issue/PR；没有技术方案也可以提出需求。
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交确认
      options:
        - label: 我已检查正文与附件，不包含凭证、真实业务文档或未脱敏的敏感信息。
          required: true

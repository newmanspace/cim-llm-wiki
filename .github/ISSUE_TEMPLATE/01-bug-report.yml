name: 缺陷报告 / Bug
description: 报告可以复现的错误、数据异常或回归。
title: '[Bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue，并尽量使用合成数据提供最小复现。此仓库公开：不要提交密码、Token、Cookie、连接串、真实业务文档或未脱敏的日志、截图、内网地址及原件路径。涉及真实漏洞利用或敏感证据时，请先通过团队已有的私密渠道联系维护者。
  - type: textarea
    id: actual-behavior
    attributes:
      label: 实际行为与影响
      description: 描述发生了什么，以及影响哪些操作或数据。根因尚未确认时无需猜测。
      placeholder: 例如：合成文档提交审核后返回错误，无法进入待审核列表。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 版本与环境
      description: 提供提交 SHA 或发布版本、运行方式，以及相关组件的版本；不相关项可省略。不要粘贴完整环境变量。
      placeholder: '提交 SHA；Docker/本地；Node/Go/浏览器版本；受影响组件。'
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现步骤
      description: 提供必要配置片段、合成输入和操作顺序；无法稳定复现时说明频率与触发条件。
      placeholder: |
        1. 使用合成项目和脱敏配置……
        2. 执行……
        3. 观察到……
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: 期望行为
      description: 说明正确结果，以及修复后如何确认问题已解决。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志、截图或关联记录（可选，必须脱敏）
      description: 仅提供必要的错误片段、公开 CI 链接或相关 Issue/PR。原件路径可用 /shared/demo/source.xlsx 等合成路径代替。
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交确认
      options:
        - label: 我已检查正文与附件，不包含凭证、真实业务文档或未脱敏的敏感信息。
          required: true

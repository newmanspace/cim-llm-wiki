name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '41 2 * * 1'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  node:
    name: JavaScript checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: mkdir -p reports
      - run: npm run quality:lint
      - if: ${{ !cancelled() }}
        run: npm run test:coverage
      - if: ${{ !cancelled() }}
        run: npm run quality:duplicates -- --fail-on-empty
      - if: ${{ !cancelled() }}
        run: npm audit --registry=https://registry.npmjs.org --audit-level=high --json > reports/npm-root.json
      - if: ${{ !cancelled() }}
        run: npm audit --prefix wiki --registry=https://registry.npmjs.org --audit-level=high --json > reports/npm-wiki.json
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-quality-reports
          path: reports/
          if-no-files-found: error
          retention-days: 14

  go:
    name: Go checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cim_quality
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cim_quality"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/cim_quality?sslmode=disable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - run: mkdir -p reports
      - run: go vet ./internal/... ./cmd/...
      - if: ${{ !cancelled() }}
        run: go test -race -json -coverprofile=reports/go.cover -coverpkg=./internal/...,./cmd/... ./internal/... ./cmd/... | tee reports/go-tests.json
      - if: ${{ !cancelled() }}
        run: |
          go tool cover -func=reports/go.cover > reports/go-coverage.txt
          go tool cover -html=reports/go.cover -o reports/go-coverage.html
          node scripts/check-go-coverage.mjs reports/go.cover
      - if: ${{ !cancelled() }}
        run: go run github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0 -ignore '_test\.go$' -over 15 internal cmd | tee reports/go-complexity.txt
      - if: ${{ !cancelled() }}
        run: |
          GOBIN="$RUNNER_TEMP/quality-tools" go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          GOTOOLCHAIN="$(go env GOVERSION)" "$RUNNER_TEMP/quality-tools/govulncheck" -json ./internal/... ./cmd/... > reports/go-vulnerabilities.json
          python3 scripts/check-go-vulnerabilities.py reports/go-vulnerabilities.json
      - if: ${{ !cancelled() }}
        run: go build -o "$RUNNER_TEMP/cim-server" ./cmd/server
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-quality-reports
          path: reports/
          if-no-files-found: error
          retention-days: 14

  python:
    name: Python checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: python3 -m pip install ruff==0.17.3 coverage==7.17.2 fastapi==0.162.0 python-multipart==0.0.22
      - run: mkdir -p reports/python-coverage
      - run: ruff check deploy scripts tests --output-format=json --output-file=reports/python-lint.json
      - if: ${{ !cancelled() }}
        run: python3 -m compileall -q deploy
      - if: ${{ !cancelled() }}
        run: coverage run -m unittest discover -s tests/python
      - if: ${{ !cancelled() }}
        run: coverage json
      - if: ${{ !cancelled() }}
        run: coverage html
      - if: ${{ !cancelled() }}
        run: coverage report
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-quality-reports
          path: reports/
          if-no-files-found: error
          retention-days: 14

  admin:
    name: Admin build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - if: ${{ !cancelled() }}
        run: npm run test:coverage
      - if: ${{ !cancelled() }}
        run: npm audit --registry=https://registry.npmjs.org --audit-level=high --json > npm-audit.json
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-quality-reports
          path: |
            admin/coverage/
            admin/npm-audit.json
          if-no-files-found: error
          retention-days: 14

  wiki:
    name: Wiki build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            wiki/package-lock.json
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Configure isolated build data
        run: |
          echo "CIM_WIKI_WORKSPACE=$RUNNER_TEMP/cim-wiki-fixture" >> "$GITHUB_ENV"
          echo "WIKI_ROOT=$RUNNER_TEMP/cim-wiki-fixture/data/wiki" >> "$GITHUB_ENV"
      - run: node scripts/ci-wiki-fixture.mjs "$CIM_WIKI_WORKSPACE"
      - run: npm ci --prefix wiki --no-audit --no-fund
      - run: npm run docs:build --prefix wiki

  configuration:
    name: Configuration checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - run: docker compose -f deploy/docker-compose.yml config --quiet
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Scan Git history
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --no-banner --log-opts=--all .

  gate:
    name: Quality Gate
    if: ${{ always() }}
    needs: [node, go, python, admin, wiki, configuration, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs=JSON.parse(process.env.RESULTS); for(const [name,job] of Object.entries(jobs)){console.log(name + ": " + job.result);if(job.result!=="success")process.exitCode=1}'

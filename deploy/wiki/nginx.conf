server {
    listen 5174;
    server_name _;
    absolute_redirect off;
    location ~ (^|/)\. { deny all; }
    location ~ ^/wiki/([a-zA-Z0-9][a-zA-Z0-9_-]*)(/.*)$ {
        set $project $1;
        set $page $2;
        if (-f /data/projects/$project/site/.maintenance) { return 503; }
        root /data/projects/$project/site/html;
        try_files $page $page.html $page/index.html =404;
        add_header Cache-Control "no-cache" always;
    }
    location /wiki/ { return 404; }
    location /wiki-preview/ {
        root /data/wiki-previews;
        rewrite ^/wiki-preview/(.*)$ /$1 break;
        try_files $uri $uri.html $uri/index.html =404;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location / { return 404; }
}

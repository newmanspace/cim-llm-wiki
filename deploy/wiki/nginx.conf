server {
    listen 5174;
    server_name _;
    absolute_redirect off;
    location /wiki/ {
        if (-f /data/wiki-site/.maintenance) { return 503; }
        root /data/wiki-site/html;
        rewrite ^/wiki/(.*)$ /$1 break;
        try_files $uri $uri.html $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
    }
    location /wiki-preview/ {
        root /data/wiki-previews;
        rewrite ^/wiki-preview/(.*)$ /$1 break;
        try_files $uri $uri.html $uri/index.html =404;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location ~ (^|/)\. { deny all; }
    location / { return 404; }
}

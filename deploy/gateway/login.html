<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登录 · CIM LLM Wiki</title>
<style>
  :root { --brand: #07c05f; --bg: #f2f3f5; --card: #ffffff; --text: #1a1a1a; --muted: #86909c; --border: #dcdcdc; --danger: #d54941; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #181818; --card: #242424; --text: #e6e6e6; --muted: #9aa0a6; --border: #3a3a3a; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    width: 100%; max-width: 380px; background: var(--card);
    border: 1px solid var(--border); border-radius: 12px; padding: 32px 28px;
    box-shadow: 0 8px 30px rgba(0,0,0,.08);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .brand .dot { width: 26px; height: 26px; border-radius: 6px; background: var(--brand); }
  .brand h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 24px; }
  label { display: block; font-size: 13px; margin: 14px 0 6px; color: var(--muted); }
  input {
    width: 100%; padding: 10px 12px; font-size: 15px; color: var(--text);
    background: var(--card); border: 1px solid var(--border); border-radius: 8px; outline: none;
  }
  input:focus { border-color: var(--brand); box-shadow: 0 0 0 2px rgba(7,192,95,.15); }
  button {
    width: 100%; margin-top: 24px; padding: 11px; font-size: 15px; font-weight: 600;
    color: #fff; background: var(--brand); border: none; border-radius: 8px; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: not-allowed; }
  .err { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 14px; }
</style>
</head>
<body>
  <form class="card" id="login-form" autocomplete="off">
    <div class="brand"><span class="dot"></span><h1>CIM LLM Wiki</h1></div>
    <p class="sub">知识库与管理控制台登录</p>
    <label for="username">用户名 / Username</label>
    <input id="username" name="username" type="text" required autocomplete="username" />
    <label for="password">密码 / Password</label>
    <input id="password" name="password" type="password" required autocomplete="current-password" />
    <div class="err" id="err"></div>
    <button type="submit" id="submit">登录</button>
  </form>
<script>
  (function () {
    var form = document.getElementById('login-form');
    var errEl = document.getElementById('err');
    var btn = document.getElementById('submit');

    function safeNext() {
      var p = new URLSearchParams(location.search).get('next');
      // 仅允许站内相对路径，拒绝 //host 形式的开放重定向
      if (p && p.charAt(0) === '/' && p.charAt(1) !== '/') return p;
      return '/wiki/';
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      errEl.textContent = '';
      btn.disabled = true;
      fetch('/api/v1/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      }).then(function (resp) {
        return resp.json().then(function (data) { return { ok: resp.ok, data: data }; });
      }).then(function (r) {
        if (r.ok) {
          location.href = safeNext();
        } else {
          errEl.textContent = (r.data && r.data.error) || '登录失败';
          btn.disabled = false;
        }
      }).catch(function () {
        errEl.textContent = '网络错误，请重试';
        btn.disabled = false;
      });
    });
  })();
</script>
</body>
</html>

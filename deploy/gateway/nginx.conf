# ==============================================================================
# cim-llm-wiki 统一入口网关 (gateway)
# 单一端口对外暴露：wiki (VitePress) + admin 控制台 + 后端 API
#   /wiki/   → 知识库站点  web:5174   (VitePress，base '/wiki/'，按 project 分树)
#   /admin/  → Admin 控制台 admin:80   (Vue3 SPA，base '/admin/')
#   /api/    → 后端服务    server:8080 (/api/v1/*，含 admin REST)
#   /        → 重定向到 /wiki/
# ==============================================================================

# 上游：保留原始 URI 反代（proxy_pass 不带 URI 段），VitePress 自身处理 /wiki/ base
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout                 60s;

server {
    listen 80;
    server_name _;

    # 网关常在非标准端口（如 :8099）对外，重定向必须保留 Host:Port，
    # 否则 absolute redirect 会丢端口。用相对 Location 交给浏览器按当前 origin 解析。
    absolute_redirect off;
    port_in_redirect off;

    # ── 后端 API（含 /api/v1/admin/*）───────────────────────────────────────
    location /api/ {
        proxy_pass http://server:8080;
    }

    # ── Admin 控制台 SPA（history 模式由 admin 容器内 nginx 兜底）────────────
    location /admin/ {
        proxy_pass http://admin:80;
    }

    # ── 知识库站点（VitePress，base=/wiki/，深链 /wiki/<project>/...）────────
    location /wiki/ {
        proxy_pass http://web:5174;
    }

    # ── 根路径重定向到 wiki 首页 ────────────────────────────────────────────
    location = / {
        return 302 /wiki/;
    }
}

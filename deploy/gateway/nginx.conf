# ==============================================================================
# cim-llm-wiki 统一入口网关 (gateway)
# 单一端口对外暴露：wiki (VitePress) + admin 控制台 + 后端 API
#   /wiki/   → 知识库站点  wiki:5174   (VitePress，base '/wiki/'，按 project 分树)
#   /admin/  → Admin 控制台 admin:80   (Vue3 SPA，base '/admin/')
#   /api/    → 后端服务    server:8080 (/api/v1/*，含 admin REST)
#   /login/  → 登录页（公开，自包含）
#   /        → 重定向到 /wiki/
#
# 访问鉴权：/wiki/ 与 /admin/ 通过 nginx auth_request 校验后端签发的会话 cookie。
#   - 校验子请求打到 /api/v1/auth/verify（后端读取 cookie，HMAC 校验 + 过期判断）
#   - 2xx → 放行；401 → error_page 跳登录页并保留原始 URL (?next=)
#   - /api/ 不门控（流水线用 project-token 走 Bearer；登录/校验本身也须公开可达）
#   - AUTH_ENABLED=false 时后端 verify 恒 200，门控变透明（不会误锁）
# ==============================================================================

# 上游：保留原始 URI 反代（proxy_pass 不带 URI 段），VitePress 自身处理 /wiki/ base
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout                 60s;

server {
    listen 80;
    server_name _;

    # 网关常在非标准端口（如 :8099）对外，重定向必须保留 Host:Port，
    # 否则 absolute redirect 会丢端口。用相对 Location 交给浏览器按当前 origin 解析。
    absolute_redirect off;
    port_in_redirect off;

    # ── 会话校验子请求目标（internal：仅 auth_request 可达，不对外）────────────
    location = /_auth {
        internal;
        proxy_pass http://server:8080/api/v1/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }

    # ── 未登录：跳登录页并保留原始目标 ─────────────────────────────────────────
    location @need_login {
        return 302 /login?next=$request_uri;
    }

    # ── 后端 API（含 /api/v1/admin/*，token 认证；不门控）──────────────────────
    location /api/v2/knowledge/ {
        proxy_pass http://knowledge:8090;
        client_max_body_size 8m;
        proxy_read_timeout 900s;
    }

    location /api/ {
        proxy_pass http://server:8080;
    }

    # ── 登录页（公开、自包含，内联 CSS/JS）─────────────────────────────────────
    # 注意用无斜杠 /login：alias 指向单文件时，带斜杠 URI 会触发 nginx index 处理报 500。
    location = /login/ {
        return 302 /login$is_args$args;
    }
    location = /login {
        alias /usr/share/nginx/html/login.html;
        default_type text/html;
    }

    # ── Admin 控制台 SPA（history 模式由 admin 容器内 nginx 兜底）────────────
    location /admin/ {
        auth_request /_auth;
        error_page 401 = @need_login;
        proxy_pass http://admin:80;
    }

    # ── 知识库站点（VitePress，base=/wiki/，深链 /wiki/<project>/...）────────
    location /wiki/ {
        auth_request /_auth;
        error_page 401 = @need_login;
        proxy_pass http://wiki:5174;
    }

    # ── 根路径重定向到 wiki 首页（未登录会被 wiki 的门控转到登录页）───────────
    location = / {
        return 302 /wiki/;
    }
}

# ==============================================================================
# cim-llm-wiki 统一容器编排服务 (docker-compose.yml)
# 运行说明: 在仓库根目录配置 .env 后执行 docker compose --env-file .env -f deploy/docker-compose.yml up -d --build
# 统一入口 (gateway :8099，推荐对外只开这一个端口):
#   - 知识库 Wiki 站点:   http://<宿主机IP>:8099/
#   - Admin 管理控制台:   http://<宿主机IP>:8099/admin/
#   - 后端流水线/Admin API: http://<宿主机IP>:8099/api/v1/...
# 直连调试端口 (各自独立，可选):
#   - 后端流水线 API 服务: http://<宿主机IP>:8080
#   - 知识库 Web 交互界面: http://<宿主机IP>:5174
#   - Admin 控制台独立:   http://<宿主机IP>:8095/admin/
# ==============================================================================

services:
  # ── 1. 后端业务服务: 5阶段知识处理流水线 (Go) ─────────────────────────────
  server:
    build:
      context: ..
      dockerfile: deploy/server/Dockerfile
    image: cim-wiki-server:latest
    container_name: cim-wiki-server
    ports:
      - "8080:8080"
    volumes:
      - ../data:/app/data
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - WIKI_OUTPUT_DIR=/app/data/wiki
      - WIKI_RAW_DIR=/app/data/raw
      - MINERU_ENDPOINT=http://mineru:8888
      - DOCLING_ENDPOINT=http://docling:5001
      - MARKITDOWN_ENDPOINT=http://markitdown:5002
      - ADMIN_ENABLED=${ADMIN_ENABLED:-true}
      - ADMIN_DATABASE_URL=postgres://${POSTGRES_USER:-cimwiki}:${POSTGRES_PASSWORD:-cimwiki_dev_2026}@postgres:5432/${POSTGRES_DB:-cim_wiki_admin}?sslmode=disable
      - ADMIN_MIGRATION_DIR=/app/deploy/postgres
      - CIM_WIKI_KNOWLEDGE_URL=http://knowledge:8090
      - CIM_WIKI_LEDGER_TOKEN=${CIM_WIKI_LEDGER_TOKEN:-}
      - CIM_WIKI_REVIEW_TOKENS=${CIM_WIKI_REVIEW_TOKENS:-}
      # ── 访问鉴权（网关会话登录，保护 /wiki/ 与 /admin/）────────────────
      #    凭证来源暂用 env（机制先行），启动前配置独立随机 SECRET 与 bcrypt 摘要；旧 SHA256 配置会被拒绝。
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - AUTH_SESSION_SECRET=${AUTH_SESSION_SECRET:-}
      - AUTH_COOKIE_NAME=${AUTH_COOKIE_NAME:-cim_session}
      - AUTH_SESSION_TTL_HOURS=${AUTH_SESSION_TTL_HOURS:-12}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - AUTH_PASSWORD_HASH=${AUTH_PASSWORD_HASH:-}
      # Forward the obsolete variable so the server rejects unmigrated configurations.
      - AUTH_PASSWORD_SHA256=${AUTH_PASSWORD_SHA256:-}
    restart: unless-stopped
    depends_on:
      mineru:
        condition: service_started
      docling:
        condition: service_started
      markitdown:
        condition: service_started
      postgres:
        condition: service_healthy

  # Shared-directory workflow; local agents only need the lightweight skill.
  knowledge:
    build:
      context: ..
      dockerfile: deploy/knowledge/Dockerfile
    image: cim-wiki-knowledge:latest
    volumes:
      - ../data:/app/data
      - ${CIM_WIKI_SHARED_DIR:-../data/shared}:/shared
      - ${CIM_WIKI_ORGANIZED_DIR:-../data/organized}:/organized
    environment:
      - CIM_WIKI_WORKSPACE=/app
      - CIM_WIKI_LEDGER_URL=${CIM_WIKI_LEDGER_URL:-}
      - CIM_WIKI_LEDGER_TOKEN=${CIM_WIKI_LEDGER_TOKEN:-}
      - CIM_WIKI_ORGANIZED_ROOT=/organized
      - WIKI_ROOT=/app/data/wiki
      - CIM_WIKI_SHARED_ROOTS={"team":"/shared"}
      - CIM_WIKI_AUTO_PUBLISH=${CIM_WIKI_AUTO_PUBLISH:-false}
      - CIM_WIKI_API_TOKEN=${CIM_WIKI_API_TOKEN:-}
      - CIM_WIKI_REVIEW_TOKENS=${CIM_WIKI_REVIEW_TOKENS:-}
      - MINERU_ENDPOINT=http://mineru:8888
      - DOCLING_ENDPOINT=http://docling:5001
      - MARKITDOWN_ENDPOINT=http://markitdown:5002
    restart: unless-stopped
    depends_on:
      - mineru
      - docling
      - markitdown

  # ── 2. 前端展示服务: VitePress 知识库 Web 交互站点 ──────────────────────────
  wiki:
    build:
      context: ..
      dockerfile: deploy/wiki/Dockerfile
    image: cim-wiki-web:latest
    container_name: cim-wiki-web
    ports:
      - "5174:5174"
    volumes:
      - ../data/wiki:/data/wiki
      - ../data:/app/data:ro
      - ${CIM_WIKI_SHARED_DIR:-../data/shared}:/shared
      - ${CIM_WIKI_ORGANIZED_DIR:-../data/organized}:/organized:ro
    environment:
      - PORT=5174
      - WIKI_ROOT=/data/wiki
      - CIM_WIKI_SHARED_ROOTS={"team":"/shared"}
    restart: unless-stopped
    depends_on:
      - server

  # ── 2b. Admin 管理控制台: Vue3 + Element Plus SPA (nginx 静态托管 + /api 反代) ────
  #     docker compose up -d 即随全栈启动，访问 http://<宿主机IP>:8095/admin/
  admin:
    build:
      context: ..
      dockerfile: deploy/admin/Dockerfile
    image: cim-wiki-admin:latest
    container_name: cim-wiki-admin
    ports:
      - "8095:80"
    restart: unless-stopped
    depends_on:
      - server

  # ── 3. MinerU: 复杂 PDF 解析引擎 (双栏/跨页表格/公式, SDD/IDD 主力) ────────
  mineru:
    image: alexsuntop/mineru:3.4.2
    container_name: cim-wiki-mineru
    command: mineru-api --host 0.0.0.0 --port 8888
    ports:
      - "8888:8888"
    volumes:
      - mineru_data:/tmp
    restart: unless-stopped

  # ── 4. Docling: Office/Word/HTML 文档解析引擎 (IBM 开源) ──────────────────
  docling:
    build: ./docling
    image: deploy-docling:latest
    container_name: cim-wiki-docling
    ports:
      - "5001:5001"
    restart: unless-stopped

  # ── 5. MarkItDown: 备选通用解析引擎 (微软开源) ────────────────────────────
  markitdown:
    build: ./markitdown
    image: deploy-markitdown:latest
    container_name: cim-wiki-markitdown
    ports:
      - "5002:5002"
    restart: unless-stopped

  # ── 6. Qdrant: 向量检索（Phase 3 混合检索预留）─────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: cim-wiki-qdrant
    profiles: ["retrieval"]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ── 7. Meilisearch: BM25 全文检索（Phase 3 预留）───────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.8
    container_name: cim-wiki-meili
    profiles: ["retrieval"]
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-changeme}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    restart: unless-stopped

  # ── 8. PostgreSQL: Admin 系统持久化存储（Project Registry）─────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cim-wiki-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cim_wiki_admin}
      POSTGRES_USER: ${POSTGRES_USER:-cimwiki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cimwiki_dev_2026}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cimwiki} -d ${POSTGRES_DB:-cim_wiki_admin}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── 9. Gateway: 统一入口反向代理 (wiki + admin + api 同一端口对外) ───────────
  #     访问 http://<宿主机IP>:8099/        → 知识库站点 (VitePress)
  #           http://<宿主机IP>:8099/admin/ → Admin 管理控制台
  #           http://<宿主机IP>:8099/api/   → 后端 API (含 /api/v1/admin/*)
  gateway:
    build:
      context: ..
      dockerfile: deploy/gateway/Dockerfile
    image: cim-wiki-gateway:latest
    container_name: cim-wiki-gateway
    ports:
      - "8099:80"
    restart: unless-stopped
    depends_on:
      - knowledge
      - server
      - wiki
      - admin

volumes:
  mineru_data:
  qdrant_data:
  meili_data:
  pg_data:

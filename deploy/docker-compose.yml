# ==============================================================================
# cim-llm-wiki 统一容器编排服务 (docker-compose.yml)
# 运行说明: cd deploy && docker compose up -d
# 访问地址:
#   - 知识库 Web 交互界面: http://<宿主机IP>:5174
#   - 后端流水线 API 服务: http://<宿主机IP>:8080
# ==============================================================================

services:
  # ── 1. 后端业务服务: 5阶段知识处理流水线 (Go) ─────────────────────────────
  server:
    build:
      context: ..
      dockerfile: deploy/server/Dockerfile
    image: cim-wiki-server:latest
    container_name: cim-wiki-server
    ports:
      - "8080:8080"
    volumes:
      - ../data:/app/data
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - WIKI_OUTPUT_DIR=/app/data/wiki
      - WIKI_RAW_DIR=/app/data/raw
      - MINERU_ENDPOINT=http://mineru:8888
      - DOCLING_ENDPOINT=http://docling:5001
      - MARKITDOWN_ENDPOINT=http://markitdown:5002
    restart: unless-stopped
    depends_on:
      - mineru
      - docling
      - markitdown

  # ── 2. 前端展示服务: VitePress 知识库 Web 交互站点 ──────────────────────────
  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    image: cim-wiki-web:latest
    container_name: cim-wiki-web
    ports:
      - "5174:5174"
    volumes:
      - ../data/wiki:/data/wiki
    environment:
      - PORT=5174
      - WIKI_ROOT=/data/wiki
    restart: unless-stopped
    depends_on:
      - server

  # ── 3. MinerU: 复杂 PDF 解析引擎 (双栏/跨页表格/公式, SDD/IDD 主力) ────────
  mineru:
    image: alexsuntop/mineru:3.4.2
    container_name: cim-wiki-mineru
    command: mineru-api --host 0.0.0.0 --port 8888
    ports:
      - "8888:8888"
    volumes:
      - mineru_data:/tmp
    restart: unless-stopped

  # ── 4. Docling: Office/Word/HTML 文档解析引擎 (IBM 开源) ──────────────────
  docling:
    build: ./docling
    image: deploy-docling:latest
    container_name: cim-wiki-docling
    ports:
      - "5001:5001"
    restart: unless-stopped

  # ── 5. MarkItDown: 备选通用解析引擎 (微软开源) ────────────────────────────
  markitdown:
    build: ./markitdown
    image: deploy-markitdown:latest
    container_name: cim-wiki-markitdown
    ports:
      - "5002:5002"
    restart: unless-stopped

  # ── 6. Qdrant: 向量检索（Phase 3 混合检索预留）─────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: cim-wiki-qdrant
    profiles: ["retrieval"]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ── 7. Meilisearch: BM25 全文检索（Phase 3 预留）───────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.8
    container_name: cim-wiki-meili
    profiles: ["retrieval"]
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-changeme}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    restart: unless-stopped

volumes:
  mineru_data:
  qdrant_data:
  meili_data:

# docker-compose.yml for cim-llm-wiki infrastructure
# Run: cd deploy && docker compose up -d
#
# 解析引擎（全部为独立 HTTP server，本地不做任何文档解析；skill scripts/parse.mjs 仅作 HTTP 客户端）:
#   MinerU     → http://localhost:8888  (复杂 PDF: 双栏/跨页表格/公式, SDD/IDD 主力)
#   Docling    → http://localhost:5001  (DOCX/PPTX/XLSX/HTML 主力, IBM 开源)
#   MarkItDown → http://localhost:5002  (备选服务端引擎, --engine markitdown 显式指定)
# 检索基础设施（Phase 3 混合检索预留）:
#   Qdrant(6333) / Meilisearch(7700)
#
# 国内镜像拉取:
#   MinerU:
#     docker pull swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/alexsuntop/mineru:3.4.2
#     docker tag 上述镜像 opendatalab/mineru:latest
#   Docling:
#     docker pull swr.cn-north-4.myhuaweicloud.com/ddn-k8s/quay.io/docling-project/docling-serve:latest
#     docker tag 上述镜像 quay.io/docling-project/docling-serve:latest
#
# 客户端环境变量（.env 或 shell）:
#   MINERU_ENDPOINT=http://localhost:8888
#   DOCLING_ENDPOINT=http://localhost:5001
#   MARKITDOWN_ENDPOINT=http://localhost:5002
version: "3.9"

services:
  # ── MinerU: 复杂 PDF 解析（SDD/IDD 主力引擎）──────────────────────────────
  # 国内镜像: alexsuntop/mineru:3.4.2 (华为云 SWR pull+tag 为 opendatalab/mineru:latest)
  # CPU 模式即可运行（较慢）；有 NVIDIA GPU 时按官方文档改用 GPU 镜像/参数:
  # https://opendatalab.github.io/MinerU/quick_start/docker_deployment/
  mineru:
    image: alexsuntop/mineru:3.4.2
    container_name: cim-wiki-mineru
    command: mineru-api --host 0.0.0.0 --port 8888
    ports:
      - "8888:8888"
    volumes:
      - mineru_data:/tmp
    restart: unless-stopped

  # ── Docling: Office/HTML 文档解析（IBM 开源，FastAPI 包装对齐项目契约）─────
  # 基础镜像 quay.io/docling-project/docling-serve:latest 需先按上方华为云镜像 pull+tag
  docling:
    build: ./docling
    container_name: cim-wiki-docling
    ports:
      - "5001:5001"
    restart: unless-stopped

  # ── MarkItDown: 备选服务端解析引擎（微软开源，轻量 Office/PDF/HTML → MD）──
  markitdown:
    build: ./markitdown
    container_name: cim-wiki-markitdown
    ports:
      - "5002:5002"
    restart: unless-stopped

  # ── Qdrant: 向量检索（Phase 3 预留）───────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: cim-wiki-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ── Meilisearch: BM25 全文检索（Phase 3 预留）─────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.8
    container_name: cim-wiki-meili
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-changeme}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    restart: unless-stopped

volumes:
  mineru_data:
  qdrant_data:
  meili_data:

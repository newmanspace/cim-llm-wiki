# 项目标识
sonar.projectKey=cim-llm-wiki
sonar.projectName=cim-llm-wiki

# SonarQube 服务器
sonar.host.url=http://mesap03:9092

# 源码和测试
sonar.sources=internal,cmd,packages
sonar.tests=tests,packages
sonar.test.inclusions=**/*_test.go,**/*.test.go,**/test/**,**/*.test.mjs,**/*.test.js
sonar.exclusions=**/node_modules/**,**/test/**,**/*.test.mjs,**/*.test.js,**/*.test.go,**/*_test.go
sonar.go.coverage.reportPaths=coverage.out
